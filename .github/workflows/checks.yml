# Generated by the development repository's publishing tooling from the
# project's declared checks, which also gate every publish. Edit the checks
# there; a change made only here is overwritten by the next publish.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-import-smoke-test:
    name: compile + import smoke test
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - name: compile + import smoke test
        run: |
          python -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet ../_shared/ha-mqtt-bridge-toolkit ../_shared/python-github-error-reporter
          python -m compileall -q .
          EMPORIA_USERNAME=x EMPORIA_PASSWORD=x MQTT_PASSWORD=x python -c "import main"
