# Generated by the development repository's publishing tooling from the
# project's declared images. Edit them there; a change made only here is
# overwritten by the next publish.
#
# Every push to main builds the images for linux/amd64 and linux/arm64 and
# pushes them to the GitHub Container Registry (ghcr.io).
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  emporia-vue-mqtt-bridge:
    name: emporia-vue-mqtt-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Add the application code to the published image
        working-directory: .
        shell: bash
        run: |
          user="$(awk '$1 == "USER" {u = $2} END {print u}' Dockerfile)"
          {
            cat Dockerfile
            printf '\nUSER root\nCOPY app/ /app/\nRUN chmod -R a+rX /app/\n'
            if [ -n "$user" ]; then printf 'USER %s\n' "$user"; fi
          } > Dockerfile.published
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/geoffmyers/emporia-vue-mqtt-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=emporia-vue-mqtt-bridge
            org.opencontainers.image.licenses=GPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.published
          build-contexts: |
            ha_mqtt_bridge=./_shared/ha-mqtt-bridge-toolkit
            python_github_error_reporter=./_shared/python-github-error-reporter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=emporia-vue-mqtt-bridge
          cache-to: type=gha,mode=max,scope=emporia-vue-mqtt-bridge
