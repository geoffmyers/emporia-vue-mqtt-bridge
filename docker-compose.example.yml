services:
  emporia-vue-mqtt-bridge:
    build:
      context: .
      additional_contexts:
        ha_mqtt_bridge: ./_shared/ha-mqtt-bridge-toolkit
        python_github_error_reporter: ./_shared/python-github-error-reporter
    image: ghcr.io/geoffmyers/emporia-vue-mqtt-bridge:latest
    container_name: emporia-vue-mqtt-bridge
    restart: unless-stopped
    stop_grace_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
    # ThreadedPublisher (from ha-mqtt-bridge-toolkit) touches /tmp/healthy on
    # every publish. With a 60s poll, a fresh mtime within 300s means the
    # bridge has made forward progress in the last ~5 cycles.
    healthcheck:
      test:
        - CMD-SHELL
        - 'mtime=$$(stat -c %Y /tmp/healthy 2>/dev/null) && [ "$$(( $$(date +%s) - mtime ))" -lt 300 ]'
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      # Application code is bind-mounted (not baked into the image), so a code
      # change needs only a restart, not a rebuild. Read-only.
      - ./app:/app:ro
