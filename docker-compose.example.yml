# emporia-vue-mqtt-bridge — example deployment
#
# Copy this to docker-compose.yml and .env.example to .env, fill in .env,
# then `docker compose up -d --build`.
#
# The image is published as ghcr.io/geoffmyers/emporia-vue-mqtt-bridge (`docker compose pull`),
# or build it here (`docker compose build`). The build
# vendors the shared HA-discovery/MQTT toolkit from ./_shared — see
# ARCHITECTURE.md. Requires Docker Compose v2.17+ (for `additional_contexts`).
services:
  emporia-vue-mqtt-bridge:
    build:
      context: .
      additional_contexts:
        ha_mqtt_bridge: ./_shared/ha-mqtt-bridge-toolkit
        python_github_error_reporter: ./_shared/python-github-error-reporter
    image: ghcr.io/geoffmyers/emporia-vue-mqtt-bridge:latest
    container_name: emporia-vue-mqtt-bridge
    hostname: emporia-vue-mqtt-bridge
    restart: unless-stopped
    stop_grace_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    environment:
      EMPORIA_USERNAME: ${EMPORIA_USERNAME}
      EMPORIA_PASSWORD: ${EMPORIA_PASSWORD}
      MQTT_HOST: ${MQTT_HOST:-mqtt.example.com}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TLS: ${MQTT_TLS:-0}
      MQTT_CA_FILE: ${MQTT_CA_FILE:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      HA_DISCOVERY_PREFIX: ${HA_DISCOVERY_PREFIX:-homeassistant}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-emporia}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional production-error reporting — off unless both are set.
      GITHUB_ERROR_TOKEN: ${GITHUB_ERROR_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_ERROR_ENVIRONMENT: ${GITHUB_ERROR_ENVIRONMENT:-production}
    # ThreadedPublisher (toolkit) touches /tmp/healthy after every successful
    # MQTT publish. With a 60s poll, a fresh mtime within 600s means the
    # bridge is alive and has made forward progress in the last ~10 cycles.
    healthcheck:
      test:
        - CMD-SHELL
        - 'mtime=$$(stat -c %Y /tmp/healthy 2>/dev/null) && [ "$$(( $$(date +%s) - mtime ))" -lt 600 ]'
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      # Application code bind-mounted (not baked into the image) so a code
      # change needs only a restart, not a rebuild. Read-only.
      - ./app:/app:ro
